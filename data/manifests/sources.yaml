  # --- Manual human download (never fetched by our own tool) ------------------
  manual:
    owner: "n/a -- a real human, using an ordinary browser"
    base_url: null
    endpoints: ["Whatever a human manually retrieves per docs/data/manual-download-checklist.md"]
    access_method: "scripts/import_local.py reads data/inbox/ + its own real provenance.csv row; this project's own acquisition tool never fetches these itself."
    verdict: "AVAILABLE_WITH_LIMITS"
    verdict_reason: >-
      Real, previously-undiscovered gap found in Phase 6A §3: this project's own
      ledgerlight.acquisition.import_local module has always written
      ManifestEntry(source_id="manual", ...) for every real manually-downloaded
      document, but "manual" was never added as a real row in this file -- meaning
      scripts/store_backfill.py's own real documents.source_id foreign-key insert
      would fail for every one of Phase 0's own 14 documented manual-download items,
      every time, for the whole life of this project so far. This entry closes that
      gap. AVAILABLE_WITH_LIMITS (not AVAILABLE) because this path is explicitly
      human-driven, not automated -- there is no real "fetch" for a scheduler to run.
