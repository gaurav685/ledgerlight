repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          [pydantic>=2.9, pydantic-settings>=2.5, types-pyyaml, httpx>=0.27, structlog>=24.4, tenacity>=9.0]
        pass_filenames: false
        args: []

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^tests/fixtures/

  - repo: local
    hooks:
      - id: reject-raw-data-paths
        name: reject staged files under data/raw, data/interim, data/processed
        entry: python scripts/check_no_raw_data_staged.py
        language: python
        pass_filenames: true

      - id: pytest-fast
        name: pytest (non-network, pre-push only)
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
