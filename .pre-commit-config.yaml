repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^tests/fixtures/

  - repo: local
    hooks:
      - id: reject-raw-data-paths
        name: reject staged files under data/raw, data/interim, data/processed
        entry: python scripts/check_no_raw_data_staged.py
        language: python
        pass_filenames: true

      - id: mypy
        name: mypy (project venv -- avoids a second, heavy isolated env)
        entry: ./.venv/Scripts/python.exe -m mypy
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest-fast
        name: pytest (non-network, pre-push only)
        entry: ./.venv/Scripts/python.exe -m pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
