[project]
name = "ledgerlight"
version = "0.1.0"
description = "Ledgerlight: evidence-backed corporate-governance red-flag intelligence for Indian listed companies (Phase 0)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<0.28",
    "tenacity>=9.0,<10",
    "structlog>=24.4,<25",
    "pyyaml>=6.0,<7",
    "truststore>=0.10,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "respx>=0.21,<0.22",
    "ruff>=0.7,<0.8",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<4",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
    "types-boto3>=1.35,<2",
    "types-pyyaml>=6.0,<7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ledgerlight"]

[tool.pytest.ini_options]
markers = [
    "network: tests that require real network access (excluded by default)",
]
addopts = "-m 'not network'"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledgerlight"]
