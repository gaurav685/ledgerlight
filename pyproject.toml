[project]
name = "ledgerlight"
version = "0.1.0"
description = "Ledgerlight: evidence-backed corporate-governance red-flag intelligence for Indian listed companies (Phase 0)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<0.28",
    "tenacity>=9.0,<10",
    "structlog>=24.4,<25",
    "pyyaml>=6.0,<7",
    "truststore>=0.10,<1",
    "pymupdf>=2.0,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "beautifulsoup4>=4.12,<5",
    "filetype>=1.2,<2",
    "boto3>=1.35,<2",
    "dagster>=1.8,<2",
    "dagster-postgres>=0.24,<1",
    "pgvector>=0.3,<1",
    "rapidfuzz>=3.9,<4",
    "rank-bm25>=0.2,<1",
    "scikit-learn>=1.5,<2",
    "torch>=2.14,<3",
    "transformers>=4.45,<6",
    "sentence-transformers>=3.2,<7",
    "lightgbm>=4.5,<5",
    "shap>=0.46,<1",
    "argon2-cffi>=23.1,<24",
    "cryptography>=43.0,<44",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "python-multipart>=0.0.12,<0.1",
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "respx>=0.21,<0.22",
    "ruff>=0.7,<0.8",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<4",
    "types-boto3>=1.35,<2",
    "types-pyyaml>=6.0,<7",
    "pandas-stubs>=2.2,<4",
    "dagster-webserver>=1.8,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by `alembic revision --autogenerate`; not hand-formatted.
"ledgerlight/db/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ledgerlight"]

[[tool.mypy.overrides]]
module = "filetype.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rapidocr_onnxruntime.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pymupdf.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "ledgerlight.orchestration.*"
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "rapidfuzz.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rank_bm25.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "shap.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lightgbm.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "network: tests that require real network access (excluded by default)",
    "integration: tests that require the local Docker stack (Postgres/Garage) (excluded by default)",
    "corpus: tests that run against real data/raw content; skip cleanly if absent (excluded by default)",
]
addopts = "-m 'not network and not integration and not corpus'"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledgerlight"]
