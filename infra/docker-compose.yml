name: ledgerlight-phase0

services:
  postgres:
    # Tag pinned to a specific pgvector-on-Postgres-16 release tag (not
    # ":latest"). We did not resolve/record the underlying image digest here
    # because the local Docker daemon was unavailable at write time — see
    # docs/phase-0/environment-report.md and the infra-check results in
    # docs/phase-0/phase-0-report.md for what was actually verified.
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      POSTGRES_USER: ${LEDGERLIGHT_POSTGRES_USER:-ledgerlight}
      POSTGRES_PASSWORD: ${LEDGERLIGHT_POSTGRES_PASSWORD:-changeme-local-only}
      POSTGRES_DB: ${LEDGERLIGHT_POSTGRES_DB:-ledgerlight}
    ports:
      - "127.0.0.1:${LEDGERLIGHT_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEDGERLIGHT_POSTGRES_USER:-ledgerlight} -d ${LEDGERLIGHT_POSTGRES_DB:-ledgerlight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    # Object storage. MinIO's community edition carries an unpatched
    # auth-bypass CVE (CVE-2026-40344) with the fix shipped only in the
    # commercial AIStor product — no community-edition patch exists to
    # build from source. Garage is an actively maintained, S3-native,
    # officially-published image with no equivalent open CVE at pin time.
    # See docs/adr/0003-object-storage.md.
    image: dxflrs/garage:v2.4.1
    restart: "no"
    environment:
      # Local-only, loopback-bound, no real data behind these — generate
      # with `openssl rand -hex 32` (rpc_secret) and any string (admin
      # token) and put them in .env (gitignored). See .env.example.
      GARAGE_RPC_SECRET: ${LEDGERLIGHT_GARAGE_RPC_SECRET:?set LEDGERLIGHT_GARAGE_RPC_SECRET in .env, e.g. via `openssl rand -hex 32`}
      GARAGE_ADMIN_TOKEN: ${LEDGERLIGHT_GARAGE_ADMIN_TOKEN:?set LEDGERLIGHT_GARAGE_ADMIN_TOKEN in .env, e.g. via `openssl rand -hex 16`}
    volumes:
      - garagedata:/data
      - garagemeta:/data/meta
      - ./garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:59000:3900"
      - "127.0.0.1:59003:3903"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 5 §5. api/worker share the real root Dockerfile (same real
  # dependency set as the host .venv); web is the real Next.js
  # production build in frontend/Dockerfile. All three connect to
  # postgres/garage via their real Compose service names -- never
  # 127.0.0.1, which only reaches the HOST's own loopback from inside
  # a container, not the other services.
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    environment:
      LEDGERLIGHT_CONTACT_EMAIL: ${LEDGERLIGHT_CONTACT_EMAIL:?set LEDGERLIGHT_CONTACT_EMAIL in .env}
      LEDGERLIGHT_POSTGRES_HOST: postgres
      LEDGERLIGHT_POSTGRES_PORT: "5432"
      LEDGERLIGHT_POSTGRES_USER: ${LEDGERLIGHT_POSTGRES_USER:-ledgerlight}
      LEDGERLIGHT_POSTGRES_PASSWORD: ${LEDGERLIGHT_POSTGRES_PASSWORD:-changeme-local-only}
      LEDGERLIGHT_POSTGRES_DB: ${LEDGERLIGHT_POSTGRES_DB:-ledgerlight}
      LEDGERLIGHT_APP_DB_USER: ${LEDGERLIGHT_APP_DB_USER:-ledgerlight_app}
      LEDGERLIGHT_APP_DB_PASSWORD: ${LEDGERLIGHT_APP_DB_PASSWORD:-changeme-local-only-app}
      LEDGERLIGHT_S3_ENDPOINT: garage:3900
      LEDGERLIGHT_S3_REGION: ${LEDGERLIGHT_S3_REGION:-garage}
      LEDGERLIGHT_S3_BUCKET: ${LEDGERLIGHT_S3_BUCKET:-ledgerlight-raw}
      LEDGERLIGHT_S3_ACCESS_KEY_ID: ${LEDGERLIGHT_S3_ACCESS_KEY_ID:-}
      LEDGERLIGHT_S3_SECRET_ACCESS_KEY: ${LEDGERLIGHT_S3_SECRET_ACCESS_KEY:-}
      LEDGERLIGHT_SESSION_SECRET_KEY: ${LEDGERLIGHT_SESSION_SECRET_KEY:-dev-only-session-secret-change-me}
      LEDGERLIGHT_WEBHOOK_SECRET_ENCRYPTION_KEY: ${LEDGERLIGHT_WEBHOOK_SECRET_ENCRYPTION_KEY:-UWhA93WPMUQ7e0aYCYjBP_nKSse4xZ0Bf6qC1TxZDyw=}
      LEDGERLIGHT_COOKIE_SECURE: ${LEDGERLIGHT_COOKIE_SECURE:-false}
      LEDGERLIGHT_ENVIRONMENT: ${LEDGERLIGHT_ENVIRONMENT:-dev}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    command: ["dagster", "dev", "-m", "ledgerlight.orchestration.definitions", "-h", "0.0.0.0", "-p", "3001"]
    environment:
      LEDGERLIGHT_CONTACT_EMAIL: ${LEDGERLIGHT_CONTACT_EMAIL:?set LEDGERLIGHT_CONTACT_EMAIL in .env}
      LEDGERLIGHT_POSTGRES_HOST: postgres
      LEDGERLIGHT_POSTGRES_PORT: "5432"
      LEDGERLIGHT_POSTGRES_USER: ${LEDGERLIGHT_POSTGRES_USER:-ledgerlight}
      LEDGERLIGHT_POSTGRES_PASSWORD: ${LEDGERLIGHT_POSTGRES_PASSWORD:-changeme-local-only}
      LEDGERLIGHT_POSTGRES_DB: ${LEDGERLIGHT_POSTGRES_DB:-ledgerlight}
      LEDGERLIGHT_POSTGRES_DAGSTER_DB: ${LEDGERLIGHT_POSTGRES_DAGSTER_DB:-ledgerlight_dagster}
      LEDGERLIGHT_APP_DB_USER: ${LEDGERLIGHT_APP_DB_USER:-ledgerlight_app}
      LEDGERLIGHT_APP_DB_PASSWORD: ${LEDGERLIGHT_APP_DB_PASSWORD:-changeme-local-only-app}
      LEDGERLIGHT_S3_ENDPOINT: garage:3900
      LEDGERLIGHT_S3_REGION: ${LEDGERLIGHT_S3_REGION:-garage}
      LEDGERLIGHT_S3_BUCKET: ${LEDGERLIGHT_S3_BUCKET:-ledgerlight-raw}
      LEDGERLIGHT_S3_ACCESS_KEY_ID: ${LEDGERLIGHT_S3_ACCESS_KEY_ID:-}
      LEDGERLIGHT_S3_SECRET_ACCESS_KEY: ${LEDGERLIGHT_S3_SECRET_ACCESS_KEY:-}
      LEDGERLIGHT_ENVIRONMENT: ${LEDGERLIGHT_ENVIRONMENT:-dev}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      LEDGERLIGHT_API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  garagedata:
  garagemeta:
