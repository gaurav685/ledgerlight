name: ledgerlight-phase0

services:
  postgres:
    # Tag pinned to a specific pgvector-on-Postgres-16 release tag (not
    # ":latest"). We did not resolve/record the underlying image digest here
    # because the local Docker daemon was unavailable at write time — see
    # docs/phase-0/environment-report.md and the infra-check results in
    # docs/phase-0/phase-0-report.md for what was actually verified.
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      POSTGRES_USER: ${LEDGERLIGHT_POSTGRES_USER:-ledgerlight}
      POSTGRES_PASSWORD: ${LEDGERLIGHT_POSTGRES_PASSWORD:-changeme-local-only}
      POSTGRES_DB: ${LEDGERLIGHT_POSTGRES_DB:-ledgerlight}
    ports:
      - "127.0.0.1:${LEDGERLIGHT_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEDGERLIGHT_POSTGRES_USER:-ledgerlight} -d ${LEDGERLIGHT_POSTGRES_DB:-ledgerlight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    # Object storage. MinIO's community edition carries an unpatched
    # auth-bypass CVE (CVE-2026-40344) with the fix shipped only in the
    # commercial AIStor product — no community-edition patch exists to
    # build from source. Garage is an actively maintained, S3-native,
    # officially-published image with no equivalent open CVE at pin time.
    # See docs/adr/0003-object-storage.md.
    image: dxflrs/garage:v2.4.1
    restart: "no"
    environment:
      # Local-only, loopback-bound, no real data behind these — generate
      # with `openssl rand -hex 32` (rpc_secret) and any string (admin
      # token) and put them in .env (gitignored). See .env.example.
      GARAGE_RPC_SECRET: ${LEDGERLIGHT_GARAGE_RPC_SECRET:?set LEDGERLIGHT_GARAGE_RPC_SECRET in .env, e.g. via `openssl rand -hex 32`}
      GARAGE_ADMIN_TOKEN: ${LEDGERLIGHT_GARAGE_ADMIN_TOKEN:?set LEDGERLIGHT_GARAGE_ADMIN_TOKEN in .env, e.g. via `openssl rand -hex 16`}
    volumes:
      - garagedata:/data
      - garagemeta:/data/meta
      - ./garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:59000:3900"
      - "127.0.0.1:59003:3903"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  garagedata:
  garagemeta:
